<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUARTE - FINAL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Orbitron',sans-serif}
.card{position:relative;width:90%;max-width:380px;padding:24px 18px 22px;background:rgba(12,0,3,0.92);border:1px solid #ff1a2e;box-shadow:0 0 12px rgba(255,26,46,0.9),0 0 40px rgba(255,26,46,0.5);z-index:2;transition:0.6s}
.corner{position:absolute;width:20px;height:20px;background:#000;border:2px solid #ff1a2e;box-shadow:0 0 10px #ff1a2e}
.corner.tl{top:-1px;left:-1px;border-right:0;border-bottom:0}.corner.tr{top:-1px;right:-1px;border-left:0;border-bottom:0}.corner.bl{bottom:-1px;left:-1px;border-right:0;border-top:0}.corner.br{bottom:-1px;right:-1px;border-left:0;border-top:0}
.title{color:#fff;text-align:center;font-size:15px;font-weight:800;letter-spacing:1.5px;text-shadow:0 0 6px #fff,0 0 14px #ff1a2e;margin-bottom:16px;display:flex;justify-content:center;gap:8px;align-items:center}
.btn{width:100%;height:54px;margin:10px 0;border-radius:13px;border:1px solid rgba(255,80,90,0.9);background:linear-gradient(90deg,#ff3344 0%,#ff1a2e 45%,#b8000f 100%);color:#fff;font-family:'Orbitron';font-weight:800;font-size:12.5px;letter-spacing:1.2px;display:flex;justify-content:center;align-items:center;gap:8px;cursor:pointer;box-shadow:0 0 12px rgba(255,26,46,0.85)}
.btn-off{width:100%;height:54px;margin:10px 0;border-radius:13px;border:1px solid #555;background:linear-gradient(90deg,#666 0%,#444 45%,#222 100%);color:#aaa;font-family:'Orbitron';font-weight:800;font-size:12.5px;letter-spacing:1.2px;display:flex;justify-content:center;align-items:center;gap:8px;cursor:not-allowed;opacity:0.7}
#tela2,#telaSucesso{display:none;opacity:0;transform:scale(0.7) translateY(80px)}#tela2.show,#telaSucesso.show{display:block;animation:popIn .6s forwards}
@keyframes popIn{to{opacity:1;transform:scale(1) translateY(0)}} .hide{animation:popOut .4s forwards}@keyframes popOut{to{opacity:0;transform:scale(0.7) translateY(-80px)}}
.online{margin:0 auto 16px;display:flex;justify-content:center;gap:6px;width:fit-content;padding:6px 16px;border-radius:20px;border:1px solid rgba(255,26,46,0.6);background:rgba(255,26,46,0.14);font-size:9.5px;color:#ff6a75}
.online i{width:7px;height:7px;background:#ff1a2e;border-radius:50%;display:inline-block}
.socials{display:flex;justify-content:space-around;margin-top:22px}
.soc{text-align:center;text-decoration:none}.soc .icon{width:62px;height:62px;border-radius:50%;background:#fff;border:2.5px solid #ff1a2e;display:flex;justify-content:center;align-items:center;font-size:28px;box-shadow:0 0 12px rgba(255,26,46,0.8);transition:0.2s}.soc:active .icon{transform:scale(0.92)}.soc p{font-size:9px;color:#fff;margin-top:8px;letter-spacing:0.5px;font-weight:700}
.key-box{width:100%;padding:16px 12px;background:linear-gradient(135deg, rgba(255,26,46,0.15) 0%, rgba(0,0,0,0.8) 100%);border:1.5px solid #ff1a2e;border-radius:12px;text-align:center;margin-bottom:14px}
.key-text{color:#fff;font-size:17px;font-weight:900;letter-spacing:2px;text-shadow:0 0 10px #ff1a2e;word-break:break-all}
</style>
</head>
<body>

<div class="card" id="tela1">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="title">🔓 SELECIONE A KEY</div>
  <button class="btn-off">🔒 KEY PROXY - OFF</button>
  <button class="btn" onclick="abrirTela2()">🔑 GERAR KEY FFH4X</button>
</div>

<div class="card" id="tela2">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="title">DUARTE ✔</div>
  <div class="online"><i></i> SERVIDOR ONLINE</div>
  <div class="title" style="font-size:13px">🌐 LIBERAR KEY FFH4X</div>
  <button class="btn" onclick="gerarKey()">🔑 GERAR KEY FFH4X</button>
  <button class="btn-off">🔒 PROXY - OFF</button>

  <!-- SÓ 3 BOTÕES COM LINKS DIFERENTES -->
  <div class="socials">
    <a class="soc" href="https://chat.whatsapp.com/G5RiTwDYkld2wtVg6BkcTo?s=cl&p=a&mlu=4&ilr=4" target="_blank">
      <div class="icon" style="background:#25D366;border-color:#25D366">💬</div><p>ZAP GRUPO</p>
    </a>
    <a class="soc" href="https://www.youtube.com/@DUARTE_MODDER" target="_blank">
      <div class="icon" style="background:#FF0000;border-color:#FF0000">▶️</div><p>CANAL YT</p>
    </a>
    <a class="soc" href="https://t.me/duartemoddergp" target="_blank">
      <div class="icon" style="background:#0088cc;border-color:#0088cc">✈️</div><p>TELEGRAM</p>
    </a>
  </div>
</div>

<div class="card" id="telaSucesso">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="title" style="color:#fff">✅ KEY GERADA COM SUCESSO!</div>
  <div class="key-box"><div class="key-text" id="keyGerada">DUARTE-XXXX</div></div>
  <button class="btn" onclick="copiarKey()">📋 COPIAR KEY</button>
  <button class="btn" style="background:rgba(255,26,46,0.1)" onclick="reiniciar()">🔄 VOLTAR</button>
</div>

<script>
const KEY_FIXA = "MTHFREE-DCG40T";
let telaAtual='tela1';
function abrirTela2(){
  const t1=document.getElementById('tela1'); const t2=document.getElementById('tela2');
  t1.classList.add('hide');
  setTimeout(()=>{t1.style.display='none';t2.style.display='block';setTimeout(()=>{t2.classList.add('show');telaAtual='tela2'},20)},400)
}
function gerarKey(){
  document.getElementById('keyGerada').innerText = KEY_FIXA;
  const atual=document.getElementById(telaAtual); const suc=document.getElementById('telaSucesso');
  atual.classList.add('hide');
  setTimeout(()=>{atual.style.display='none';suc.style.display='block';setTimeout(()=>suc.classList.add('show'),20)},400)
}
function copiarKey(){ navigator.clipboard.writeText(document.getElementById('keyGerada').innerText).then(()=>alert('COPIADO!')) }
function reiniciar(){
  const s=document.getElementById('telaSucesso'); const t1=document.getElementById('tela1');
  s.classList.remove('show'); setTimeout(()=>{s.style.display='none';t1.style.display='block';t1.classList.remove('hide');telaAtual='tela1'},300)
}
</script>
</body>
</html>
